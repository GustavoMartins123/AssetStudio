name: AssetStudioBuild

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Texture2DDecoderNative (x64 Release)
        run: msbuild Texture2DDecoderNative/Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Restore AssetStudio.Avalonia
        run: dotnet restore AssetStudio.Avalonia/AssetStudio.Avalonia.csproj -r win-x64

      - name: Publish AssetStudio.Avalonia (win-x64)
        run: pwsh -File scripts/publish-windows.ps1 -Configuration Release -Platform x64 -SkipNative

      - name: Verify Native Texture Decoder in Publish Output
        shell: pwsh
        run: |
          $dll = "AssetStudio.Avalonia/bin/Release/net10.0/win-x64/publish/x64/Texture2DDecoderNative.dll"
          if (-not (Test-Path $dll)) {
            throw "Expected native texture decoder was not copied to '$dll'."
          }

      - name: Upload AssetStudio.Avalonia (win-x64) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.Avalonia-win-x64
          path: AssetStudio.Avalonia/bin/Release/net10.0/win-x64/publish
          if-no-files-found: error
