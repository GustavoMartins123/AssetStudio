name: Avalonia

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build Texture2DDecoderNative (Linux x64)
        run: |
          cmake -S Texture2DDecoderNative -B Texture2DDecoderNative/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Texture2DDecoderNative/build --parallel

      # Linux FFmpeg shared libraries (AssetStudio.Avalonia/Libraries/x64/ffmpeg/) are
      # intentionally omitted from Git and fetched on demand by scripts/publish-linux.sh
      # during Linux release packaging; the managed + native decoder CI build works without them.
      - name: Validate Linux packaging scripts
        run: bash -n scripts/publish-linux.sh scripts/package-linux.sh scripts/smoke-test-cli.sh

      - name: Restore Avalonia
        run: dotnet restore AssetStudio.Avalonia/AssetStudio.Avalonia.csproj --locked-mode

      - name: Build Avalonia
        run: dotnet build AssetStudio.Avalonia/AssetStudio.Avalonia.csproj --configuration Release --no-restore

      - name: Restore Tests
        run: dotnet restore AssetStudio.Tests/AssetStudio.Tests.csproj --locked-mode

      - name: Set up Blender
        uses: ./.github/actions/setup-blender

      - name: Run Tests
        timeout-minutes: 15
        env:
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: dotnet test AssetStudio.Tests/AssetStudio.Tests.csproj -c Release --no-restore --verbosity normal --blame-hang-timeout 10m --blame-hang-dump-type none --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: TestResults
          if-no-files-found: ignore

      - name: Smoke Test Linux Publish (linux-x64)
        env:
          RestoreLockedMode: 'true'
        run: bash scripts/publish-linux.sh -c Release -r linux-x64 --skip-native --skip-ffmpeg-download

      - name: Verify Linux Publish Output
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="AssetStudio.Avalonia/bin/Release/net10.0/linux-x64/publish"
          if [[ ! -x "$publish_dir/AssetStudio.Avalonia" ]]; then
            echo "Expected published binary was not found or is not executable: '$publish_dir/AssetStudio.Avalonia'." >&2
            exit 1
          fi
          if [[ ! -f "$publish_dir/x64/libTexture2DDecoderNative.so" ]]; then
            echo "Expected native texture decoder was not copied to '$publish_dir/x64/libTexture2DDecoderNative.so'." >&2
            exit 1
          fi

      - name: Publish and smoke test AssetStudio.CLI (linux-x64)
        shell: bash
        env:
          RestoreLockedMode: 'true'
        run: |
          set -euo pipefail
          dotnet restore AssetStudio.CLI/AssetStudio.CLI.csproj -p:RuntimeIdentifier=linux-x64 --locked-mode
          cli_dir="AssetStudio.CLI/bin/Release/net10.0/linux-x64/publish"
          dotnet publish AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -p:RuntimeIdentifier=linux-x64 --self-contained true --no-restore -o "$cli_dir"
          mkdir -p "$cli_dir/x64"
          cp Texture2DDecoderNative/build/libTexture2DDecoderNative.so "$cli_dir/x64/"
          bash scripts/smoke-test-cli.sh "$cli_dir/AssetStudio.CLI"

      - name: Upload AssetStudio.CLI (linux-x64) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AssetStudio.CLI-linux-x64
          path: AssetStudio.CLI/bin/Release/net10.0/linux-x64/publish
          if-no-files-found: error
