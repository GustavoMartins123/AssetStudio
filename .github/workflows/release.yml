name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional version tag for artifact naming (e.g. v0.18.0). Leave empty to auto-resolve from git release tags / DefaultReleaseVersion.'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create GitHub Release as draft (applies when triggered on a v* tag ref)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Resolve release version
        id: version
        shell: pwsh
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = "Stop"
          function Normalize-Ver([string]$v) {
            if ([string]::IsNullOrWhiteSpace($v)) { return "" }
            return ($v.Trim() -replace '^[vV]+(?=[0-9])', '')
          }
          function Get-GitTag([string[]]$gitArgs) {
            $out = & git -c versionsort.suffix=- tag @gitArgs --list "v[0-9]*" --sort=-v:refname 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $out) { return "" }
            foreach ($line in @($out)) {
              $t = "$line".Trim()
              if ($t -match '^[vV][0-9]+(?:\.[0-9]+){1,3}(?:-[0-9A-Za-z.-]+)?$') {
                return (Normalize-Ver $t)
              }
            }
            return ""
          }
          function Parse-NumVer([string]$v) {
            if ($v -match '^([0-9]+(?:\.[0-9]+){0,3})') {
              $p = @($Matches[1].Split('.'))
              while ($p.Count -lt 4) { $p += '0' }
              return [Version]::new([int]$p[0], [int]$p[1], [int]$p[2], [int]$p[3])
            }
            return $null
          }

          $raw = ""
          if ($env:REF -like "refs/tags/v*") {
            $raw = $env:REF_NAME
          }
          elseif (-not [string]::IsNullOrWhiteSpace($env:INPUT_RELEASE_TAG)) {
            $raw = $env:INPUT_RELEASE_TAG.Trim()
          }
          else {
            $exactTag = Get-GitTag @("--points-at", "HEAD")
            if (-not [string]::IsNullOrWhiteSpace($exactTag)) {
              $raw = $exactTag
            }
            else {
              $defaultVer = ""
              if (Test-Path -LiteralPath "Directory.Build.props") {
                [xml]$xml = Get-Content -LiteralPath "Directory.Build.props"
                $candidate = $xml.Project.PropertyGroup.DefaultReleaseVersion | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -First 1
                $defaultVer = Normalize-Ver $candidate
              }

              $gitTag = Get-GitTag @("--merged", "HEAD")
              if ([string]::IsNullOrWhiteSpace($gitTag)) {
                $gitTag = Get-GitTag @()
              }

              if ([string]::IsNullOrWhiteSpace($gitTag)) {
                $raw = $defaultVer
              }
              elseif ([string]::IsNullOrWhiteSpace($defaultVer)) {
                $raw = $gitTag
              }
              else {
                $gNum = Parse-NumVer $gitTag
                $dNum = Parse-NumVer $defaultVer
                if ($null -ne $gNum -and $null -ne $dNum -and $gNum -lt $dNum) {
                  $raw = $defaultVer
                }
                elseif ($null -ne $gNum -and $null -ne $dNum -and $gNum -eq $dNum -and $gitTag.Contains('-') -and -not $defaultVer.Contains('-')) {
                  $raw = $defaultVer
                }
                else {
                  $raw = $gitTag
                }
              }

              if ([string]::IsNullOrWhiteSpace($raw)) {
                $raw = "0.18.0"
              }
            }
          }

          $version = Normalize-Ver $raw
          if ($version -notmatch '^[0-9A-Za-z][0-9A-Za-z._-]*$') {
            throw "Invalid release version '$version' derived from '$raw'."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved release version: $version"

      - name: Build Texture2DDecoderNative (x64 Release)
        run: msbuild Texture2DDecoderNative/Texture2DDecoderNative.vcxproj /p:Configuration=Release /p:Platform=x64 /m /verbosity:minimal

      - name: Restore Tests
        run: dotnet restore AssetStudio.Tests/AssetStudio.Tests.csproj --locked-mode

      - name: Set up Blender
        uses: ./.github/actions/setup-blender

      - name: Run Tests
        timeout-minutes: 15
        env:
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: dotnet test AssetStudio.Tests/AssetStudio.Tests.csproj -c Release --no-restore --verbosity normal --blame-hang-timeout 10m --blame-hang-dump-type none --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-windows
          path: TestResults
          if-no-files-found: ignore

      # Use -p:RuntimeIdentifier=win-x64 instead of -r win-x64 so NuGet preserves
      # <RuntimeIdentifiers> from Directory.Build.props when validating multi-RID lockfiles.
      - name: Restore AssetStudio.Avalonia (win-x64)
        run: dotnet restore AssetStudio.Avalonia/AssetStudio.Avalonia.csproj -p:RuntimeIdentifier=win-x64 --locked-mode

      - name: Publish AssetStudio.Avalonia (win-x64)
        env:
          RestoreLockedMode: 'true'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: pwsh -File scripts/publish-windows.ps1 -Configuration Release -Platform x64 -SkipNative -Version "${{ steps.version.outputs.version }}"

      - name: Verify and archive Windows release output
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $publishDir = "AssetStudio.Avalonia/bin/Release/net10.0/win-x64/publish"
          foreach ($required in @(
            (Join-Path $publishDir "AssetStudio.Avalonia.exe"),
            (Join-Path $publishDir "x64/Texture2DDecoderNative.dll")
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Expected release file was not found: '$required'."
            }
          }

          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          $zipPath = "dist/AssetStudio-win-x64-$($env:RELEASE_VERSION).zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Get-Item -LiteralPath $zipPath | Select-Object Name, Length

      - name: Publish, smoke test and archive AssetStudio.CLI (win-x64)
        shell: pwsh
        env:
          RestoreLockedMode: 'true'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore AssetStudio.CLI/AssetStudio.CLI.csproj -p:RuntimeIdentifier=win-x64 --locked-mode
          $cliDir = "dist-cli/AssetStudio.CLI-win-x64"
          dotnet publish AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -p:RuntimeIdentifier=win-x64 -p:ReleaseVersion="$($env:RELEASE_VERSION)" --self-contained true --no-restore -o $cliDir
          if ($LASTEXITCODE -ne 0) { throw "dotnet publish AssetStudio.CLI failed with exit code $LASTEXITCODE." }
          New-Item -ItemType Directory -Force -Path "$cliDir/x64" | Out-Null
          Copy-Item -LiteralPath "Texture2DDecoderNative/bin/x64/Release/Texture2DDecoderNative.dll" -Destination "$cliDir/x64/"
          Get-ChildItem -LiteralPath $cliDir -Filter *.pdb -Recurse | Remove-Item -Force

          $zipPath = "dist/AssetStudio.CLI-win-x64-$($env:RELEASE_VERSION).zip"
          Compress-Archive -Path "$cliDir/*" -DestinationPath $zipPath -CompressionLevel Optimal -Force

          $unpackDir = Join-Path ([System.IO.Path]::GetTempPath()) ("AssetStudio_CliPkg_" + [Guid]::NewGuid().ToString("N"))
          try {
            Expand-Archive -LiteralPath $zipPath -DestinationPath $unpackDir -Force
            if (-not (Test-Path -LiteralPath (Join-Path $unpackDir "x64/Texture2DDecoderNative.dll"))) {
              throw "Packaged CLI archive is missing x64/Texture2DDecoderNative.dll."
            }
            pwsh -File scripts/smoke-test-cli.ps1 -CliExecutable (Join-Path $unpackDir "AssetStudio.CLI.exe") -ExpectedVersion "$($env:RELEASE_VERSION)"
          }
          finally {
            if (Test-Path -LiteralPath $unpackDir) {
              Remove-Item -LiteralPath $unpackDir -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          $checksumLines = Get-ChildItem -LiteralPath "dist" -Filter "*.zip" | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $checksumPath = "dist/SHA256SUMS-win-x64.txt"
          [System.IO.File]::WriteAllLines($checksumPath, $checksumLines, (New-Object System.Text.UTF8Encoding($false)))
          Get-Content -LiteralPath $checksumPath
          Get-Item -LiteralPath $zipPath | Select-Object Name, Length

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: |
            dist/AssetStudio-win-x64-*.zip
            dist/AssetStudio.CLI-win-x64-*.zip
            dist/SHA256SUMS-win-x64.txt
          if-no-files-found: error

  build-linux-x64:
    name: Build Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ dpkg-dev file tar xz-utils

      - name: Resolve release version
        id: version
        shell: bash
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          normalize_ver() {
            local v="${1:-}"
            v="${v#"${v%%[![:space:]]*}"}"
            v="${v%"${v##*[![:space:]]}"}"
            while [[ "$v" =~ ^[vV][0-9] ]]; do
              v="${v#[vV]}"
            done
            printf '%s' "$v"
          }
          get_git_tag() {
            local tag=""
            tag="$(git -c versionsort.suffix=- tag "$@" --list 'v[0-9]*' --sort=-v:refname 2>/dev/null | head -n 1 || true)"
            if [[ "$tag" =~ ^[vV][0-9]+(\.[0-9]+){1,3}(-[0-9A-Za-z.-]+)?$ ]]; then
              normalize_ver "$tag"
              return 0
            fi
            return 1
          }
          cmp_num_ver() {
            local v1="${1%%-*}" v2="${2%%-*}"
            local -a a1 a2
            IFS='.' read -r -a a1 <<< "$v1"
            IFS='.' read -r -a a2 <<< "$v2"
            local i n1 n2
            for i in 0 1 2 3; do
              n1="${a1[$i]:-0}"
              n2="${a2[$i]:-0}"
              if (( 10#$n1 > 10#$n2 )); then echo 1; return 0; fi
              if (( 10#$n1 < 10#$n2 )); then echo -1; return 0; fi
            done
            echo 0
          }

          raw=""
          if [[ "$REF" == refs/tags/v* ]]; then
            raw="$REF_NAME"
          elif [[ -n "${INPUT_RELEASE_TAG//[[:space:]]/}" ]]; then
            raw="$INPUT_RELEASE_TAG"
          else
            if exact_tag="$(get_git_tag --points-at HEAD)"; then
              raw="$exact_tag"
            else
              default_ver="$(sed -n 's/.*<DefaultReleaseVersion>\([^<]*\)<\/DefaultReleaseVersion>.*/\1/p' Directory.Build.props 2>/dev/null | head -n 1 || true)"
              default_ver="$(normalize_ver "$default_ver")"
              git_tag=""
              if ! git_tag="$(get_git_tag --merged HEAD)"; then
                git_tag="$(get_git_tag || true)"
              fi
              if [[ -z "$git_tag" ]]; then
                raw="$default_ver"
              elif [[ -z "$default_ver" ]]; then
                raw="$git_tag"
              else
                cmp="$(cmp_num_ver "$git_tag" "$default_ver")"
                if (( cmp > 0 )); then
                  raw="$git_tag"
                elif (( cmp < 0 )); then
                  raw="$default_ver"
                elif [[ "$git_tag" != *-* || "$default_ver" == *-* ]]; then
                  raw="$git_tag"
                else
                  raw="$default_ver"
                fi
              fi
              raw="${raw:-0.18.0}"
            fi
          fi

          version="$(normalize_ver "$raw")"
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ ]]; then
            echo "Invalid release version '$version' derived from '$raw'." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: $version"

      - name: Build Texture2DDecoderNative (Linux x64)
        run: |
          cmake -S Texture2DDecoderNative -B Texture2DDecoderNative/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Texture2DDecoderNative/build --parallel

      - name: Restore Tests
        run: dotnet restore AssetStudio.Tests/AssetStudio.Tests.csproj --locked-mode

      - name: Set up Blender
        uses: ./.github/actions/setup-blender

      - name: Run Tests
        timeout-minutes: 15
        env:
          MSBUILDDISABLENODEREUSE: '1'
          DOTNET_CLI_USE_MSBUILD_SERVER: '0'
        run: dotnet test AssetStudio.Tests/AssetStudio.Tests.csproj -c Release --no-restore --verbosity normal --blame-hang-timeout 10m --blame-hang-dump-type none --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results-linux
          path: TestResults
          if-no-files-found: ignore

      # Use -p:RuntimeIdentifier=linux-x64 instead of -r linux-x64 so NuGet preserves
      # <RuntimeIdentifiers> from Directory.Build.props when validating multi-RID lockfiles.
      - name: Restore AssetStudio.Avalonia (linux-x64)
        run: dotnet restore AssetStudio.Avalonia/AssetStudio.Avalonia.csproj -p:RuntimeIdentifier=linux-x64 --locked-mode

      - name: Validate Linux packaging scripts
        run: bash -n scripts/publish-linux.sh scripts/package-linux.sh scripts/smoke-test-cli.sh

      # scripts/package-linux.sh invokes scripts/publish-linux.sh internally (downloading
      # SHA-256-verified FFmpeg 8.1.3 LGPL shared libs and publishing self-contained linux-x64),
      # strips Windows-only runtime artifacts, and builds the .AppImage and .deb packages into dist/.
      - name: Publish and package Linux x64 (.AppImage and .deb)
        env:
          RestoreLockedMode: 'true'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package-linux.sh

      - name: Verify Linux publish output and create portable .tar.gz
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          publish_dir="AssetStudio.Avalonia/bin/Release/net10.0/linux-x64/publish"

          if [[ ! -x "$publish_dir/AssetStudio.Avalonia" ]]; then
            echo "Expected published executable was not found: '$publish_dir/AssetStudio.Avalonia'." >&2
            exit 1
          fi
          if [[ ! -f "$publish_dir/x64/libTexture2DDecoderNative.so" ]]; then
            echo "Expected native texture decoder was not found: '$publish_dir/x64/libTexture2DDecoderNative.so'." >&2
            exit 1
          fi
          if [[ ! -e "$publish_dir/x64/ffmpeg/libavcodec.so.62" ]]; then
            echo "Expected bundled FFmpeg library was not found: '$publish_dir/x64/ffmpeg/libavcodec.so.62'." >&2
            exit 1
          fi

          shopt -s nullglob
          appimages=(dist/*.AppImage)
          debs=(dist/*.deb)
          if [[ ${#appimages[@]} -eq 0 ]]; then
            echo "Expected AppImage package was not produced in dist/." >&2
            exit 1
          fi
          if [[ ${#debs[@]} -eq 0 ]]; then
            echo "Expected .deb package was not produced in dist/." >&2
            exit 1
          fi

          stage_dir="$(mktemp -d)"
          trap 'rm -rf "$stage_dir"' EXIT
          cp -a "$publish_dir" "$stage_dir/AssetStudio-linux-x64"
          tarball="dist/AssetStudio-linux-x64-${RELEASE_VERSION}.tar.gz"
          tar -czf "$tarball" -C "$stage_dir" AssetStudio-linux-x64
          ls -lh dist/

      - name: Publish, smoke test and archive AssetStudio.CLI (linux-x64)
        shell: bash
        env:
          RestoreLockedMode: 'true'
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          dotnet restore AssetStudio.CLI/AssetStudio.CLI.csproj -p:RuntimeIdentifier=linux-x64 --locked-mode
          cli_dir="dist-cli/AssetStudio.CLI-linux-x64"
          dotnet publish AssetStudio.CLI/AssetStudio.CLI.csproj -c Release -p:RuntimeIdentifier=linux-x64 -p:ReleaseVersion="${RELEASE_VERSION}" --self-contained true --no-restore -o "$cli_dir"
          mkdir -p "$cli_dir/x64"
          cp Texture2DDecoderNative/build/libTexture2DDecoderNative.so "$cli_dir/x64/"
          find "$cli_dir" -name '*.pdb' -delete

          cli_tarball="dist/AssetStudio.CLI-linux-x64-${RELEASE_VERSION}.tar.gz"
          tar -czf "$cli_tarball" -C dist-cli AssetStudio.CLI-linux-x64

          unpack_dir="$(mktemp -d)"
          trap 'rm -rf "$unpack_dir"' EXIT
          tar -xzf "$cli_tarball" -C "$unpack_dir"
          if [[ ! -f "$unpack_dir/AssetStudio.CLI-linux-x64/x64/libTexture2DDecoderNative.so" ]]; then
            echo "Packaged CLI archive is missing x64/libTexture2DDecoderNative.so." >&2
            exit 1
          fi
          bash scripts/smoke-test-cli.sh "$unpack_dir/AssetStudio.CLI-linux-x64/AssetStudio.CLI" "${RELEASE_VERSION}"

          (
            cd dist
            rm -f SHA256SUMS-linux-x64.txt
            LC_ALL=C sha256sum -- *.AppImage *.deb AssetStudio-linux-x64-*.tar.gz AssetStudio.CLI-linux-x64-*.tar.gz > SHA256SUMS-linux-x64.txt
            sha256sum -c SHA256SUMS-linux-x64.txt
            cat SHA256SUMS-linux-x64.txt
          )
          ls -lh dist/

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/AssetStudio-linux-x64-*.tar.gz
            dist/AssetStudio.CLI-linux-x64-*.tar.gz
            dist/SHA256SUMS-linux-x64.txt
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows-x64, build-linux-x64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*-x64
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          rm -f SHA256SUMS.txt SHA256SUMS-*.txt
          shopt -s nullglob
          files=(*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts were downloaded." >&2
            exit 1
          fi
          cli_win=(AssetStudio.CLI-win-x64-*.zip)
          cli_linux=(AssetStudio.CLI-linux-x64-*.tar.gz)
          if [[ ${#cli_win[@]} -eq 0 || ${#cli_linux[@]} -eq 0 ]]; then
            echo "Expected packaged AssetStudio.CLI archives for both win-x64 and linux-x64." >&2
            exit 1
          fi
          LC_ALL=C sha256sum -- "${files[@]}" > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPO" >/dev/null 2>&1; then
            echo "Release '$TAG' already exists; uploading/replacing assets..."
            gh release upload "$TAG" release-assets/* --clobber --repo "$GITHUB_REPO"
          else
            flags=(--title "$TAG" --generate-notes --verify-tag --repo "$GITHUB_REPO")
            if [[ "$INPUT_DRAFT" == "true" ]]; then
              flags+=(--draft)
            fi
            if [[ "$TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$TAG" release-assets/* "${flags[@]}"
          fi
